<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>The Sports Chef presents · Half a Cow — Private edition</title>
<meta name="description" content="Half a Cow, the Chef Stefano edition, in one self-running narrated show. Illustrative concept. Not affiliated with the National Football League.">
<link rel="canonical" href="https://telvergence.com/halfacow/private/stefano/">
<style>
  :root{--bg:#0b0b0d;--panel:#15151a;--panel2:#1d1d24;--ink:#f7f1e6;--muted:#b8b1a4;--red:#e23744;--gold:#f2b632;--green:#3ddc84;--line:#2b2b34}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.4 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  html{scroll-behavior:smooth}
  #showwrap{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  /* top bar */
  #top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:#0e0e11;flex:0 0 auto}
  #top .brand{font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:15px;color:var(--gold);white-space:nowrap}
  #top .brand span{color:var(--ink)}
  #top .kick{color:var(--muted);font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:1.5px}
  #top .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;white-space:nowrap}
  #bar{height:5px;background:#1a1a20;flex:0 0 auto}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .5s}
  /* stage */
  #stage{flex:1 1 auto;position:relative;overflow:hidden}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 6vw;opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease;pointer-events:none}
  .scene.on{opacity:1;transform:none;pointer-events:auto}
  .k{color:var(--gold);text-transform:uppercase;letter-spacing:3px;font-weight:800;font-size:clamp(13px,1.6vw,18px);margin-bottom:12px}
  h1{font-size:clamp(34px,6.2vw,84px);line-height:1.02;margin:0 0 14px;font-weight:900;letter-spacing:.5px}
  h1 em{font-style:normal;color:var(--red)}
  h2{font-size:clamp(28px,4.6vw,60px);line-height:1.06;margin:0 0 14px;font-weight:900}
  h2 em{font-style:normal;color:var(--red)}
  .sub{font-size:clamp(18px,2.2vw,28px);color:var(--muted);max-width:980px}
  .big{font-size:clamp(120px,22vw,300px);line-height:1;margin:0 0 8px;filter:drop-shadow(0 0 40px rgba(226,55,68,.35))}
  .num{font-size:clamp(44px,9vw,128px);font-weight:900;letter-spacing:2px;line-height:1;color:#fff;margin:6px 0}
  .num small{display:block;font-size:clamp(14px,1.8vw,22px);color:var(--muted);letter-spacing:1px;margin-top:10px;font-weight:600}
  .grid{display:grid;gap:12px;max-width:1150px;width:100%;margin-top:18px}
  .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 14px;font-size:clamp(15px,1.7vw,21px)}
  .card b{display:block;color:var(--gold);font-size:clamp(13px,1.3vw,15px);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  .card .v{font-size:clamp(22px,3vw,40px);font-weight:900;color:#fff;letter-spacing:1px}
  .card .d{color:var(--muted);font-size:clamp(12px,1.2vw,15px);font-family:Consolas,Menlo,monospace;margin-top:4px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:clamp(13px,1.5vw,19px);font-weight:700;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px;margin-top:16px}
  .trucks{font-size:clamp(22px,3.6vw,46px);letter-spacing:4px;line-height:1.35;max-width:1000px;margin-top:10px;word-break:break-all}
  .trucks span{display:inline-block;opacity:0;transform:scale(.4);animation:pop .35s forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .stagger>*{opacity:0;transform:translateY(12px);animation:up .5s forwards}
  @keyframes up{to{opacity:1;transform:none}}
  .flow{display:flex;gap:14px;align-items:stretch;justify-content:center;flex-wrap:wrap;max-width:1200px;margin-top:16px}
  .flow .card{flex:1 1 220px;max-width:280px;position:relative}
  .flow .card .n{position:absolute;top:-16px;left:14px;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:17px}
  .stack{display:flex;flex-direction:column;gap:8px;width:min(900px,92vw);margin-top:14px}
  .stack .card{text-align:left;display:flex;gap:14px;align-items:center}
  .stack .card b{margin:0;min-width:180px}
  .money{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(1100px,94vw);margin-top:12px}
  .money .card{text-align:left}
  .fine{font-size:clamp(12px,1.2vw,15px);color:var(--muted);max-width:1000px;margin-top:14px;line-height:1.4}
  .cta{display:inline-block;margin:8px 6px 0;padding:14px 22px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;font-weight:800;font-size:clamp(15px,1.8vw,20px);border:none;cursor:pointer}
  .cta.alt{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
  .qr{width:min(200px,28vw);height:auto;border-radius:12px;background:#fff;padding:8px}
  .closegrid{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .check{list-style:none;padding:0;margin:0;text-align:left;font-size:clamp(15px,1.7vw,21px)}
  .check li{padding:5px 0}
  /* subtitle rail + controls */
  #rail{flex:0 0 auto;padding:12px 18px 6px;background:#0e0e11;border-top:1px solid var(--line);min-height:76px;font-size:clamp(16px,1.9vw,23px);line-height:1.4;color:var(--muted);text-align:center}
  #rail s{text-decoration:none;color:var(--muted)}
  #rail s.now{color:var(--ink);font-weight:600}
  #ctl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 12px 10px;background:#0e0e11;flex:0 0 auto}
  #ctl button,#ctl select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer}
  #ctl button.play{background:var(--red);color:#fff;border-color:var(--red)}
  #ctl select{max-width:240px}
  #foot{flex:0 0 auto;padding:5px 12px 8px;text-align:center;color:#7d776c;font-size:11.5px;letter-spacing:.3px;background:#0b0b0d}
  /* start overlay */
  #start{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#2a0d10 0%,#0b0b0d 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10}
  #start .big{margin-bottom:10px}
  #start h1{font-size:clamp(40px,7vw,96px)}
  #start p{font-size:clamp(18px,2.4vw,28px);color:var(--muted);max-width:900px;margin:6px 0 22px}
  #go{background:var(--red);color:#fff;border:none;border-radius:999px;padding:20px 40px;font-size:clamp(22px,3vw,34px);font-weight:900;cursor:pointer;box-shadow:0 0 50px rgba(226,55,68,.45)}
  #start small{display:block;color:#7d776c;margin-top:18px;font-size:14px}
  @media (max-width:760px){.g5,.g6{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(2,1fr)} .money{grid-template-columns:1fr} .stack .card b{min-width:120px} #top .kick{display:none}}

  /* site map */
  #sitemap{max-width:1180px;margin:0 auto;padding:48px 24px 80px}
  #sitemap h2{font-size:clamp(30px,4.6vw,56px);margin:0 0 6px}
  #sitemap .lead{color:var(--muted);font-size:clamp(16px,1.8vw,21px);margin-bottom:22px}
  #sitemap h3{font-size:clamp(18px,2vw,24px);color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin:34px 0 10px;border-left:8px solid var(--red);padding-left:12px}
  .sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .sm a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s}
  .sm a:hover{border-color:var(--gold);transform:translateY(-2px)}
  .sm a b{display:block;font-size:clamp(17px,1.9vw,22px);margin-bottom:4px}
  .sm a span{display:block;color:var(--muted);font-size:clamp(13px,1.4vw,16px)}
  .sm a i{display:block;font-style:normal;color:#ffd9a3;font-family:Consolas,Menlo,monospace;font-size:13px;margin-top:8px;word-break:break-all}
  .sm a.lock{border-color:#3a2a10}
  .sm a .ok{display:inline-block;margin-top:6px;font-size:12px;color:var(--green);font-weight:800;letter-spacing:1px}
  #sitemap .foot2{margin-top:30px;color:#7d776c;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
  .topbtn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
</style>
<style>
#gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#2a0d10 0%,#0b0b0d 62%);color:var(--ink)}
#gate[hidden]{display:none}
#gate .in{display:grid;gap:14px;justify-items:center;max-width:680px}
#gate .big{font-size:clamp(80px,14vw,160px);line-height:1;filter:drop-shadow(0 0 40px rgba(226,55,68,.35))}
#gate h1{font-size:clamp(34px,6vw,80px);margin:0}
#gate h1 em{font-style:normal;color:var(--red)}
#gate p{margin:0;color:var(--muted);font-size:clamp(16px,2vw,24px);max-width:40em}
.pin{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(340px,80vw);margin:6px auto 0}
.pin i{display:grid;place-items:center;height:76px;border:2px solid var(--line);border-radius:14px;background:var(--panel);font:900 40px "Segoe UI",system-ui,sans-serif;color:var(--ink);font-style:normal}
.pin i.on{border-color:var(--red)} .pin i.filled{border-color:var(--gold)}
.pinwrap{position:relative;display:grid;gap:8px;justify-items:center}
#pinin{position:absolute;inset:0;opacity:0;font-size:32px;letter-spacing:1em;cursor:pointer}
#gate .msg{min-height:1.6em;font-weight:700;font-size:16px;color:var(--red)} #gate .msg.ok{color:var(--green)}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
#gate .foot{letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#7d776c}
</style>
</head>

<script>

(function(){
