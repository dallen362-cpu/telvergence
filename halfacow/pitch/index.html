<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Half a Cow · Private preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --ground:#0B0D12; --ink:#151B2C; --ink2:#1B2237; --line:#2A3247;
  --bone:#F4EFE6; --muted:#9AA3B8; --red:#D0313B; --red2:#F04A52;
  --ember:#F0A23A; --gold:#E8C46A; --good:#4CC38A; --tagink:#1A1406;
  --display:'Anton',Impact,'Arial Narrow Bold','Helvetica Neue',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto auto;
  background:radial-gradient(1200px 700px at 82% -10%,rgba(208,49,59,.20),transparent 60%),
             radial-gradient(900px 600px at -10% 110%,rgba(240,162,58,.10),transparent 60%),var(--ground)}
#stage{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;padding:clamp(18px,3vw,56px) clamp(18px,4vw,72px);
  opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s;overflow:auto}
.slide.active{opacity:1;visibility:visible;transition:opacity .5s ease}
.wrap{width:min(1560px,100%);margin:auto;display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(20px,4vw,72px);align-items:center}
.wrap.one{grid-template-columns:1fr;text-align:center;justify-items:center}
.wrap.one .chips{justify-content:center}
@media (max-width:980px){.wrap{grid-template-columns:1fr;gap:22px}}

.tag{display:inline-flex;align-items:center;gap:10px;font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:clamp(12px,1.15vw,17px);color:var(--tagink);background:var(--gold);padding:7px 14px 7px 10px;border-radius:4px;white-space:nowrap}
.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ground);box-shadow:inset 0 0 0 2px #B8943E;flex:none}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.92;letter-spacing:.004em;
  font-size:clamp(38px,6.4vw,104px);margin:14px 0 16px;text-wrap:balance}
h1 .r{color:var(--red2)}
.lede{font-size:clamp(17px,1.6vw,26px);line-height:1.42;color:var(--muted);max-width:34em;margin:0 0 18px}
.lede b{color:var(--bone)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px 9px 12px;font-weight:600;font-size:clamp(14px,1.3vw,21px);color:var(--bone);line-height:1.2}
.chip b{font-size:1.3em;font-weight:400}
.note{font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(12px,1.05vw,15px);color:var(--ember);margin-top:16px}
.fine{font-size:clamp(12px,1vw,15px);color:var(--muted);margin-top:14px;line-height:1.4}

/* visuals */
.vis{width:100%}
.trucks{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:18px}
.trucks .big{font-size:clamp(64px,8vw,132px);line-height:1}
.trucks .arrow{font-family:var(--display);font-size:clamp(34px,4vw,64px);color:var(--ember)}
.trucks .many{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;font-size:clamp(16px,1.9vw,30px);line-height:1}
.trucks .many span{text-align:center}
.mosaic{display:flex;flex-wrap:wrap;gap:8px}
.mosaic span{font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(12px,1.15vw,17px);
  background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--bone)}
.mosaic span.live{background:var(--red);border-color:var(--red);color:#fff}
.mosaic span.live::after{content:" · live";font-weight:600;letter-spacing:.04em;opacity:.9}
.tree{display:grid;gap:14px;justify-items:center}
.tree .top{background:var(--red);color:#fff;font-family:var(--display);text-transform:uppercase;font-size:clamp(22px,2.4vw,40px);padding:12px 26px;border-radius:8px;letter-spacing:.02em}
.tree .top small{display:block;font-family:var(--cond);font-size:.42em;letter-spacing:.14em;opacity:.9}
.tree .stem{width:3px;height:26px;background:var(--line)}
.tree .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.tree .leaf{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.tree .leaf b{display:block;font-family:var(--display);font-size:clamp(18px,2vw,30px);text-transform:uppercase;letter-spacing:.02em}
.tree .leaf span{color:var(--muted);font-size:clamp(13px,1.15vw,17px)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px 10px;text-align:center}
.tile b{display:block;font-size:clamp(36px,4.5vw,64px);line-height:1.1;font-weight:400}
.tile span{display:block;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(13px,1.2vw,19px);margin-top:8px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,1fr)}}
.split{display:grid;grid-template-columns:1fr 1.25fr;gap:14px}
.panel{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel.brain{border-color:rgba(240,162,58,.55);box-shadow:0 0 0 1px rgba(240,162,58,.2) inset}
.panel h3{margin:0 0 6px;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(24px,2.6vw,42px);letter-spacing:.02em}
.panel h3 small{display:block;font-family:var(--cond);color:var(--ember);letter-spacing:.14em;font-size:.4em}
.panel ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.panel li{font-size:clamp(14px,1.3vw,21px);display:flex;gap:10px;align-items:flex-start;line-height:1.3}
.panel li b{font-weight:400;font-size:1.2em;flex:none}
.number{font-family:var(--display);font-size:clamp(44px,7.4vw,124px);line-height:1;color:var(--bone);letter-spacing:.02em;text-align:center}
.number .r{color:var(--red2)}
.concept{display:inline-block;margin:10px auto 18px;font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:clamp(12px,1.1vw,16px);color:var(--ember);border:1px dashed rgba(240,162,58,.7);padding:6px 12px;border-radius:4px}
.lines{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lines span{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:clamp(13px,1.2vw,18px);display:flex;justify-content:space-between;gap:10px}
.lines span i{font-style:normal;color:var(--muted);font-family:var(--cond);letter-spacing:.06em}
.urls{display:grid;gap:12px}
.url{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-family:var(--cond);font-weight:700;
  font-size:clamp(20px,2.6vw,42px);letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:12px}
.url em{font-style:normal;color:var(--red2)}
.url .live{font-size:.42em;letter-spacing:.16em;background:var(--red);color:#fff;padding:5px 10px;border-radius:4px}
.url .open{font-size:.42em;letter-spacing:.16em;border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:4px}
.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:start}
.step{text-align:center}
.step i{display:block;width:18px;height:18px;border-radius:50%;background:var(--ink2);border:3px solid var(--line);margin:0 auto 8px}
.step.hot i{background:var(--red);border-color:var(--red2);box-shadow:0 0 0 6px rgba(208,49,59,.25)}
.step.done i{background:var(--good);border-color:var(--good)}
.step span{display:block;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(11px,1.1vw,17px);line-height:1.15}
.rail-line{height:3px;background:linear-gradient(90deg,var(--good) 0 45%,var(--red2) 45% 60%,var(--line) 60%);margin:-2px 7% 12px;border-radius:2px}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--bone);color:#0B0D12;border-radius:14px;padding:18px}
.qrbox #qr1,.qrbox #qr2{width:180px;height:180px;background:#fff;display:grid;place-items:center;border-radius:8px;overflow:hidden}
.qrbox .u{font-family:var(--cond);font-weight:700;font-size:clamp(20px,2.4vw,38px);letter-spacing:.02em;line-height:1.1;word-break:break-all}
.qrbox .u small{display:block;font-family:var(--body);font-weight:600;font-size:.5em;color:#4A4F5C;letter-spacing:0;margin-top:6px}
@media (max-width:640px){.qrbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.rung{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center}
.rung:nth-child(1){min-height:150px}.rung:nth-child(2){min-height:200px}.rung:nth-child(3){min-height:250px;border-color:rgba(240,162,58,.6)}
.rung b{display:block;font-size:clamp(30px,3.6vw,54px);font-weight:400;line-height:1}
.rung strong{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(17px,1.9vw,30px);margin:8px 0 4px;letter-spacing:.02em}
.rung span{color:var(--muted);font-size:clamp(13px,1.15vw,18px)}
.status{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.status .panel h3{font-size:clamp(20px,2.2vw,36px)}
.status .built h3{color:var(--good)}.status .next h3{color:var(--ember)}
.ask{display:grid;gap:14px;justify-items:start}
.ask .big{font-family:var(--display);font-size:clamp(56px,8vw,140px);line-height:.9;color:var(--red2);letter-spacing:.01em}
.ask h1{font-size:clamp(30px,4.6vw,72px);margin-bottom:10px}
.ask .lede{font-size:clamp(16px,1.45vw,23px)}
.ask .box{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;font-size:clamp(14px,1.3vw,21px);line-height:1.35}
.ask .box div{display:flex;gap:10px;align-items:flex-start}
.ask .box b{font-family:var(--cond);letter-spacing:.1em;text-transform:uppercase;font-size:.85em;color:var(--ember);flex:none;min-width:8.5em;padding-top:.15em}
.mark{display:inline-grid;place-items:center;width:1.15em;height:1.15em;background:var(--ember);color:#1A1406;font-family:var(--display);border-radius:.18em;font-size:1em;line-height:1}
.contact{display:grid;gap:8px;font-size:clamp(16px,1.6vw,26px)}
.contact b{font-family:var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ember);font-size:.8em}

/* cost + money model */
.cost{display:grid;gap:8px}
.cost .row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:clamp(13px,1.15vw,18px);line-height:1.25}
.cost .row b{font-family:var(--cond);font-size:1.3em;letter-spacing:.02em;white-space:nowrap;color:var(--gold);font-variant-numeric:tabular-nums}
.cost .row.total{border-color:rgba(232,196,106,.6)}.cost .row.total b{color:var(--bone)}
.cost .row.ent{background:transparent;border-style:dashed}.cost .row.ent b{color:var(--muted)}
.calc-in{display:grid;gap:10px;margin-top:6px;max-width:34em}
.calc-in label{display:grid;gap:4px;font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.calc-in label>span{display:flex;justify-content:space-between;align-items:baseline}
.calc-in output{font:400 24px var(--display);color:var(--gold);letter-spacing:.02em}
.calc-in input[type=range]{width:100%;accent-color:var(--red2)}
.calc-in .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc-in input[type=number]{font:600 17px var(--body);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--bone);width:100%;font-variant-numeric:tabular-nums}
.calc-out{display:grid;gap:10px}
.kpi{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:2px}
.kpi small{font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:400 clamp(24px,2.8vw,44px) var(--display);letter-spacing:.02em;color:var(--bone);font-variant-numeric:tabular-nums;line-height:1.05}
.kpi i{font-style:normal;font-size:clamp(12px,1vw,14px);color:var(--muted)}
.kpi.big{border-color:rgba(240,74,82,.6)}.kpi.big b{color:var(--red2)}

/* flywheel + stack */
.wheel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wheel .node{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px;min-height:120px}
.wheel .node b{font:400 clamp(24px,2.6vw,40px) var(--display);color:var(--gold);line-height:1}
.wheel .node span{font-weight:700;font-size:clamp(15px,1.4vw,22px);line-height:1.15}
.wheel .node i{font-style:normal;color:var(--muted);font-size:clamp(12px,1.05vw,16px)}
.wheel .hubc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(84px,9vw,124px);height:clamp(84px,9vw,124px);border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;align-content:center;font-size:clamp(28px,3.2vw,44px);line-height:1;box-shadow:0 0 0 8px rgba(208,49,59,.25)}
.wheel .hubc small{font:700 10px var(--cond);letter-spacing:.12em;text-transform:uppercase}
.stack{display:grid;gap:8px;justify-items:center}
.layer{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:2px;text-align:center}
.layer b{font:700 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.layer span{font-size:clamp(13px,1.15vw,17px);line-height:1.3}
.layer:nth-child(1){width:72%}.layer:nth-child(2){width:79%}.layer:nth-child(3){width:86%}.layer:nth-child(4){width:93%}.layer:nth-child(5){width:100%}
.layer.top{border-color:rgba(240,74,82,.7);background:rgba(208,49,59,.14)}.layer.top b{color:var(--red2)}
.layer.base{color:var(--muted)}
@media (max-width:980px){.layer{width:100%!important}}

.slide[data-n="13"] h1,.slide[data-n="14"] h1,.slide[data-n="15"] h1,.slide[data-n="16"] h1{font-size:clamp(30px,4.6vw,72px)}
.slide[data-n="16"] .calc-in{gap:8px}

/* subtitle rail + controls */
#rail{border-top:1px solid var(--line);background:rgba(11,13,18,.88);padding:12px clamp(16px,3vw,48px);min-height:66px;max-height:20vh;overflow:auto}
#caption{max-width:74ch;margin:0 auto;font-size:clamp(16px,1.45vw,24px);line-height:1.45;color:var(--muted)}
#caption .s{transition:color .2s}
#caption .s.on{color:var(--bone);font-weight:600}
#bar{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,2vw,32px);border-top:1px solid var(--line);background:var(--ground);flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--ink);color:var(--bone);font:600 15px var(--body);padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.link{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
#prog{flex:1;height:6px;background:var(--ink2);border-radius:3px;overflow:hidden;min-width:100px}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--red2));transition:width .4s}
#count{font-family:var(--cond);font-weight:700;letter-spacing:.1em;color:var(--muted);font-size:14px;min-width:4.5em;text-align:center}
.ctl{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ctl label{font-family:var(--cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.ctl select{background:var(--ground);color:var(--bone);border:1px solid var(--line);border-radius:6px;font:600 14px var(--body);padding:5px 8px;max-width:190px}
.ctl input[type=range]{width:120px;accent-color:var(--red2)}
.ctl output{font:700 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);min-width:5.5em}

/* start overlay */
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;text-align:center;
  background:radial-gradient(1000px 700px at 50% 30%,rgba(208,49,59,.22),transparent 60%),var(--ground)}
#overlay .in{display:grid;gap:18px;justify-items:center;max-width:820px}
#overlay .brand{display:flex;align-items:center;gap:14px;font-family:var(--display);font-size:clamp(28px,4vw,56px);text-transform:uppercase;letter-spacing:.02em}
#overlay .brand .mark{font-size:1.1em}
#overlay h1{margin:0}
#overlay .lede{margin:0;max-width:40em}
#overlay .settings{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#overlay .ctl{padding:10px 14px}
#overlay .ctl input[type=range]{width:180px}
#overlay .desc{font-size:clamp(14px,1.2vw,18px);color:var(--muted);min-height:1.4em}
#start{font:700 clamp(20px,2.2vw,30px) var(--body);padding:18px 40px;border-radius:14px}
#overlay .hint{font-family:var(--cond);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
#overlay[hidden]{display:none}
.kbd{font:600 12px var(--cond);letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.slide,#prog i,#caption .s{transition:none}}
</style>

<style>
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;text-align:center;
  background:radial-gradient(1000px 700px at 50% 30%,rgba(208,49,59,.22),transparent 60%),var(--ground);color:var(--bone)}
#gate[hidden]{display:none}
#gate .in{display:grid;gap:16px;justify-items:center;max-width:640px}
#gate .brand{display:flex;align-items:center;gap:14px;font-family:var(--display);font-size:clamp(26px,3.6vw,50px);text-transform:uppercase;letter-spacing:.02em}
#gate .brand .mark{font-size:1.1em}
#gate h2{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(26px,3.4vw,52px);line-height:1;letter-spacing:.01em}
#gate h2 .r{color:var(--red2)}
#gate p{margin:0;color:var(--muted);font-size:clamp(15px,1.4vw,20px);max-width:36em}
.pin{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(340px,80vw);margin:6px auto 0}
.pin i{display:grid;place-items:center;height:76px;border:2px solid var(--line);border-radius:12px;background:var(--ink);font:400 40px var(--display);color:var(--bone);font-style:normal}
.pin i.on{border-color:var(--ember)}
.pin i.filled{border-color:var(--gold)}
.pinwrap{position:relative;display:grid;gap:8px;justify-items:center}
#pinin{position:absolute;inset:0;opacity:0;font-size:32px;letter-spacing:1em;cursor:pointer}
#gate .msg{min-height:1.6em;font:600 16px var(--body);color:var(--red2)}
#gate .msg.ok{color:var(--good)}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
#gate .foot{font-family:var(--cond);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
#gate .foot a,#gate .foot button{color:var(--muted);background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer;padding:0;letter-spacing:inherit;text-transform:inherit}
#chg{display:grid;gap:10px;justify-items:stretch;width:min(560px,90vw);text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px}
#chg[hidden]{display:none}
#chg label{display:grid;gap:4px;font:700 12px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#chg input{font:600 22px var(--body);letter-spacing:.4em;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--bone);width:100%}
#chg textarea{width:100%;min-height:150px;font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--ground);color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:10px}
#chg .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#chg .row .btn{font-size:14px}
#chg .small{font-size:13px;color:var(--muted);line-height:1.4}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

<div id="gate">
  <div class="in">
    <div class="brand"><span class="mark">H</span> Half a Cow</div>
    <h2>The Talking Pitch<br><span class="r">Private preview</span></h2>
    <p id="gatemsg">Enter the 4-digit passcode to open the presentation.</p>
    <form id="pinform" class="pinwrap" autocomplete="off">
      <div class="pin" id="pinboxes" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>
      <input id="pinin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="4-digit passcode">
    </form>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="foot"><span>Not for distribution</span><span>·</span><button type="button" id="chgtoggle">Change passcode</button></div>
    <div id="chg" hidden>
      <div class="small">Changing the passcode re-locks the key with the new code. It produces a new <b>gate.json</b>; send it to David's Claude session to commit — the presentation itself never changes.</div>
      <label>Current passcode<input id="chgold" type="tel" inputmode="numeric" maxlength="4"></label>
      <label>New passcode (4 digits)<input id="chgnew" type="tel" inputmode="numeric" maxlength="4"></label>
      <label>New passcode again<input id="chgnew2" type="tel" inputmode="numeric" maxlength="4"></label>
      <div class="row"><button type="button" class="btn red" id="chggo">Generate new gate.json</button><button type="button" class="btn" id="chgcopy" hidden>Copy</button><span class="small" id="chgmsg"></span></div>
      <textarea id="chgout" hidden readonly spellcheck="false"></textarea>
    </div>
  </div>
</div>

  function estimate(s){ var w = s.split(/\s+/).length; return Math.round((w * (lang==='es'?430:390) + 650) / 0.95); }
  function renderCaption(t){ caption.innerHTML=''; sentences(t).forEach(function(s,k){ var span=document.createElement('span'); span.className='s'; span.dataset.k=k; span.textContent=s+' '; caption.appendChild(span); }); $('rail').scrollTop=0; }
  function highlight(k){ var all=caption.querySelectorAll('.s'); all.forEach(function(e){ e.classList.remove('on'); }); var el=all[k]; if(el){ el.classList.add('on'); var r=$('rail'); if(el.offsetTop+el.offsetHeight > r.scrollTop + r.clientHeight) r.scrollTop = el.offsetTop - 8; } }
  function cancelSpeech(){ clearTimeout(timer); if(TTS){ try{ speechSynthesis.cancel(); }catch(e){} } }

  function speakSlide(){
    cancelSpeech(); var my = ++session; var text = narration(); renderCaption(text); var sents = sentences(text); var k = 0;
    function scheduleNext(){ timer = setTimeout(function(){ if(my!==session) return; var o=order(), p=o.indexOf(i); if(p < o.length-1) { i=o[p+1]; show(); } else { setPlaying(false); } }, 1300); }
    function go(){
      if(my!==session) return;
      if(!playing){ return; }
      if(k >= sents.length){ scheduleNext(); return; }
      highlight(k); var s = sents[k++];
      if(muted || !TTS){ timer = setTimeout(go, estimate(s)); return; }
      var u = new SpeechSynthesisUtterance(s); var v = bestVoice(); if(v){ u.voice=v; u.lang=v.lang; } else { u.lang = N[lang].voicePrefs[0]; }
      u.rate = 0.95; u.pitch = 1; var done=false, wd;
      function finish(){ if(done) return; done=true; clearTimeout(wd); if(my!==session) return; timer = setTimeout(go, 120); }
      u.onend = finish; u.onerror = finish; wd = setTimeout(finish, estimate(s)*2 + 2000);
      try { speechSynthesis.speak(u); } catch(e){ finish(); }
    }
    // Chrome drops an utterance queued in the same tick as cancel(); defer one tick.
    timer = setTimeout(go, 60);
  }

  function show(){
    slides.forEach(function(s,idx){ s.classList.toggle('active', idx===i); });
    var o=order(), p=Math.max(0,o.indexOf(i));
    prog.style.width = ((p+1)/o.length*100) + '%'; count.textContent = (p+1)+' / '+o.length;
    $('stage').scrollTop = 0; slides[i].scrollTop = 0;
    speakSlide();
  }
  function setPlaying(p){ playing = p; playBtn.textContent = playing ? N[lang].ui.pause : N[lang].ui.play; if(!playing){ cancelSpeech(); } }
  function togglePlay(){ if(!started) return; if(playing){ setPlaying(false); } else { setPlaying(true); var o=order(); if(i===o[o.length-1] && !caption.querySelector('.s:not(.on)')) { i=o[0]; show(); } else { speakSlide(); } } }
  function step(d){ if(!started) return; var o=order(), p=o.indexOf(i), n=Math.min(o.length-1, Math.max(0, p+d)); if(n===p) return; i=o[n]; if(!playing) setPlaying(true); show(); }

  // ---- events
  $('askon').addEventListener('change', function(){ askOn=this.checked; relabel(); if(started){ if(!askOn && slides[i].dataset.n==='17'){ i=TOTAL-1; if(!playing) setPlaying(true); show(); } else { var o=order(),p=Math.max(0,o.indexOf(i)); prog.style.width=((p+1)/o.length*100)+'%'; count.textContent=(p+1)+' / '+o.length; } } });
  $('start').addEventListener('click', function(){ started=true; overlay.hidden=true; setPlaying(true); i=order()[0]; show(); });
  $('replay').addEventListener('click', function(){ i=order()[0]; setPlaying(true); show(); });
  playBtn.addEventListener('click', togglePlay);
  $('prev').addEventListener('click', function(){ step(-1); });
  $('next').addEventListener('click', function(){ step(1); });
  muteBtn.addEventListener('click', function(){ muted=!muted; muteBtn.textContent = muted ? N[lang].ui.voiceOff : N[lang].ui.voiceOn; if(started && playing) speakSlide(); });
  function onLang(v){ lang=v; $('lang').value=v; $('lang2').value=v; persist(); applyUI(); if(started && playing) speakSlide(); else if(started) renderCaption(narration()); }
  function onLevel(v){ level=+v; $('level').value=v; $('level2').value=v; persist(); applyUI(); if(started && playing) speakSlide(); else if(started) renderCaption(narration()); }
  $('lang').addEventListener('change', function(){ onLang(this.value); }); $('lang2').addEventListener('change', function(){ onLang(this.value); });
  $('level').addEventListener('input', function(){ onLevel(this.value); }); $('level2').addEventListener('input', function(){ onLevel(this.value); });
  document.addEventListener('keydown', function(e){ if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
    if(e.code==='Space'){ e.preventDefault(); if(!started){ $('start').click(); } else togglePlay(); }
    else if(e.key==='ArrowRight'){ step(1); } else if(e.key==='ArrowLeft'){ step(-1); }
    else if(e.key==='m'||e.key==='M'){ muteBtn.click(); } else if(e.key==='r'||e.key==='R'){ if(started) $('replay').click(); } });
  window.addEventListener('beforeunload', cancelSpeech);


  // ---- money model calculator (illustrative)
  function initCalc(){
    var ids=['c_cities','c_trucks','c_fee','c_truck','c_lines','c_rate']; var els=ids.map(function(id){return $(id);}); if(els.some(function(e){return !e;})) return;
    var fmt=function(n){ return '$'+Math.round(n).toLocaleString('en-US'); };
    function calc(){ var cities=+$('c_cities').value, tpc=+$('c_trucks').value, fee=+$('c_fee').value||0, truck=+$('c_truck').value||0, lines=+$('c_lines').value||0, rate=+$('c_rate').value||0;
      var trucks=cities*tpc, up=cities*fee+trucks*truck, yr=trucks*lines*rate*12, t3=up+yr*3, ftr=30*tpc, fup=30*fee+ftr*truck, fyr=ftr*lines*rate*12;
      $('c_cities_o').textContent=cities; $('c_trucks_o').textContent=tpc; $('o_trucks').textContent=trucks;
      $('o_upfront').textContent=fmt(up); $('o_upfront_d').textContent=cities+' × '+fmt(fee)+' + '+trucks+' × '+fmt(truck);
      $('o_year').textContent=fmt(yr); $('o_year_d').textContent=trucks+' trucks × '+lines+' lines × $'+rate.toFixed(2)+' × 12';
      $('o_3yr').textContent=fmt(t3); $('o_full').textContent=fmt(fup)+' up-front · '+fmt(fyr)+' / yr'; }
    els.forEach(function(e){ e.addEventListener('input',calc); }); calc();
  }
  // ---- QR codes (optional; degrade to the printed URL)
  try { if (window.QRCode) { ['qr1','qr2'].forEach(function(id){ new QRCode(document.getElementById(id), {text:'https://telvergence.com/halfacow/', width:172, height:172, colorDark:'#0B0D12', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M}); }); } } catch(e){}

  // initial paint: first slide visible under the overlay so the page is never blank
  slides[0].classList.add('active'); count.textContent='1 / '+TOTAL; prog.style.width=(1/TOTAL*100)+'%';
  applyUI(); relabel(); renderCaption(narration()); initCalc();

};
</script>
<script>

(function(){
  var $=function(id){return document.getElementById(id);};
  var b64d=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
  var b64e=function(u8){var s='';u8=new Uint8Array(u8);for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);};
  var enc=new TextEncoder(), dec=new TextDecoder();
  var GATE=null, CK=null, fails=0, lockedUntil=0;
  var msg=$('msg'), pinin=$('pinin'), boxes=$('pinboxes').children;

  function setMsg(t,ok){ msg.textContent=t||''; msg.className='msg'+(ok?' ok':''); }
  function paint(){ var v=pinin.value; for(var i=0;i<4;i++){ boxes[i].textContent=v[i]?'•':''; boxes[i].className=(i<v.length?'filled':'')+(i===v.length?' on':''); } }
  async function loadGate(){
    if(GATE) return GATE;
    if(location.protocol!=='file:'){
      try{ var r=await fetch('./gate.json?t='+Date.now(),{cache:'no-store'}); if(r.ok){ GATE=await r.json(); return GATE; } }catch(e){}
    }
    GATE=JSON.parse($('gate-fallback').textContent); return GATE;
  }
  async function kek(pin,saltB64,iter){ var base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(saltB64),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']); }
  async function unwrap(pin){ var g=await loadGate(); var k=await kek(pin,g.salt,g.iter); return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(g.iv)},k,b64d(g.wrapped))); }
  async function open(ck){
    var key=await crypto.subtle.importKey('raw',ck,'AES-GCM',false,['decrypt']);
    var P=JSON.parse($('payload').textContent);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(P.iv)},key,b64d(P.data));
    $('root').innerHTML=dec.decode(pt);
    $('gate').hidden=true; document.title='Half a Cow Pitch';
    if(typeof window.__bootDeck==='function') window.__bootDeck();
  }
  async function tryPin(pin){
    var now=Date.now(); if(now<lockedUntil){ setMsg('Locked for '+Math.ceil((lockedUntil-now)/1000)+'s'); return; }
    setMsg('Unlocking…',true); pinin.disabled=true;
    try{ var ck=await unwrap(pin); CK=ck; try{ sessionStorage.setItem('hac-pitch-ck',b64e(ck)); }catch(e){} await open(ck); }
    catch(e){ fails++; pinin.disabled=false; pinin.value=''; paint(); $('pinboxes').classList.remove('shake'); void $('pinboxes').offsetWidth; $('pinboxes').classList.add('shake');
      if(fails>=5){ lockedUntil=Date.now()+60000*Math.pow(2,fails-5); setMsg('Too many tries. Locked for a minute.'); } else { setMsg("That's not it — try again."); }
      setTimeout(function(){ pinin.focus(); },50); }
  }
  pinin.addEventListener('input',function(){ pinin.value=pinin.value.replace(/\D/g,'').slice(0,4); paint(); if(pinin.value.length===4) tryPin(pinin.value); });
  $('pinform').addEventListener('submit',function(e){ e.preventDefault(); if(pinin.value.length===4) tryPin(pinin.value); });
  $('gate').addEventListener('click',function(e){ if(!$('chg').contains(e.target) && e.target.id!=='chgtoggle') pinin.focus(); });
  paint(); setTimeout(function(){ pinin.focus(); },100);

  // resume within the same tab (sessionStorage clears when the tab closes)
  try{ var s=sessionStorage.getItem('hac-pitch-ck'); if(s){ CK=b64d(s); open(CK).catch(function(){ try{sessionStorage.removeItem('hac-pitch-ck');}catch(e){} }); } }catch(e){}

  // ---- change passcode (produces a new gate.json; nothing else changes)
  $('chgtoggle').addEventListener('click',function(){ var c=$('chg'); c.hidden=!c.hidden; if(!c.hidden) $('chgold').focus(); });
  $('chggo').addEventListener('click',async function(){
    var o=$('chgold').value.trim(), n=$('chgnew').value.trim(), n2=$('chgnew2').value.trim(); var cm=$('chgmsg');
    if(!/^\d{4}$/.test(n)){ cm.textContent='New passcode must be exactly 4 digits.'; return; }
    if(n!==n2){ cm.textContent='The two new passcodes do not match.'; return; }
    cm.textContent='Working…';
    try{ var ck=CK; if(!ck){ if(!/^\d{4}$/.test(o)){ cm.textContent='Enter the current passcode.'; return; } ck=await unwrap(o); }
      var g=await loadGate(); var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
      var k=await kek(n,b64e(salt),g.iter); var wrapped=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,ck));
      var out={v:1,kdf:'PBKDF2-SHA256',iter:g.iter,salt:b64e(salt),iv:b64e(iv),wrapped:b64e(wrapped),updated:new Date().toISOString().slice(0,10)};
      var ta=$('chgout'); ta.value=JSON.stringify(out,null,2); ta.hidden=false; $('chgcopy').hidden=false; cm.textContent='Done. Copy this and have it committed as halfacow/pitch/gate.json.';
    }catch(e){ cm.textContent='Current passcode is wrong.'; }
  });
  $('chgcopy').addEventListener('click',function(){ var ta=$('chgout'); ta.select(); try{ navigator.clipboard.writeText(ta.value); $('chgmsg').textContent='Copied.'; }catch(e){ document.execCommand('copy'); } });
})();

</script>
</body>
